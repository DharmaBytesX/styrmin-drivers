---
apiVersion: "styrmin.io/v1"
kind: ApplicationDriver
metadata:
  name: netbox
spec:
  version: "1"
  supported_versions: ">=4.7,<4.8"
  default_version: "4.7.3"
  info:
    icon: https://raw.githubusercontent.com/netbox-community/netbox/main/docs/netbox_logo_light.svg
    description: IP address management (IPAM) and data center infrastructure management (DCIM) tool
    links:
      - link: Homepage
        url: https://netbox.dev/
      - link: Source
        url: https://github.com/netbox-community/netbox-chart
  helm:
    main:
      location: https://charts.netbox.oss.netboxlabs.com/netbox
      version: "8.3.97"

  components:
    server:   # Deployment/<release>-netbox, image ghcr.io/netbox-community/netbox:v{{ app.version }}
      container: netbox
      identifier:
        label:
          app.kubernetes.io/component: "netbox"
      backup:
        enabled: true
        kind: disk
        volumes: [media]
    worker:   # Deployment/<release>-netbox-worker, image ghcr.io/netbox-community/netbox:v{{ app.version }}
      container: netbox-worker
      identifier:
        label:
          app.kubernetes.io/component: "worker"
    postgresql:   # StatefulSet/<release>-postgresql, image docker.io/bitnamilegacy/postgresql
      container: postgresql
      singleton: true
      identifier:
        label:
          app.kubernetes.io/name: "postgresql"
          app.kubernetes.io/component: "primary"
      backup:
        enabled: true
        kind: postgres
        database_name: netbox
    valkey:   # StatefulSet/<release>-valkey-primary, image docker.io/bitnamilegacy/valkey (standalone, no replicas)
      container: valkey
      singleton: true
      identifier:
        label:
          app.kubernetes.io/name: "valkey"
          app.kubernetes.io/component: "primary"

  services:
    - name: netbox
      kind: http
      scope: external
      port: 8080   # the port the container listens on
      component: server
