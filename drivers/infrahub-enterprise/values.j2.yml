---
global:
  infrahubTag: "{{ app.version }}"
infrahub:
  fullnameOverride: styrmin-infrahub
  infrahubDemoData:
    enabled: false
  infrahubServer:
    ingress:
      enabled: true
      hostname: "{{ services.infrahub.primary_fqdn }}"
      extraHosts:
        - hostname: "{{ services.infrahub.human_readable_fqdn }}"
          path: /
    infrahubServer:
      # Hard-coded chart wiring. The infrahub chart expects a map (key: value),
      # not a [{name, value}] list (see the chart's templates/_env.tpl).
      env:
        PREFECT_API_URL: "http://styrmin-task-manager:4200/api"
        INFRAHUB_WORKFLOW_ADDRESS: styrmin-task-manager
    persistence:
      accessMode: ReadWriteOnce
      enabled: true
      storageClassName: "{{ instance.config.standard_storage.storage_class }}"
  infrahubTaskWorker:
    infrahubTaskWorker:
      # Hard-coded chart wiring, map shape (see the infrahubServer note above).
      env:
        PREFECT_API_URL: "http://styrmin-task-manager:4200/api"
        INFRAHUB_WORKFLOW_ADDRESS: styrmin-task-manager
  nats:
    enabled: false
  neo4j:
    additionalVolumeMounts:
      - mountPath: /backup
        name: backup
    additionalVolumes:
      - emptyDir: {}
        name: backup
    config:
      server.backup.enabled: "true"
    disableLookups: true
    fullnameOverride: styrmin-database
    services:
      admin:
        enabled: true
    volumes:
      data:
        dynamic:
          requests:
            storage: "{{ parameters.database_storage_size }}Gi"
          storageClassName: "{{ instance.config.fast_storage.storage_class }}"
        mode: dynamic
  nfs-server-provisioner:
    enabled: false
  prefect-server:
    enabled: true
    fullnameOverride: styrmin-task-manager
    global:
      prefect:
        image:
          prefectTag: "{{ app.version }}"
        # Set here, not under server.env, so the chart's server.env defaults survive.
        env:
          - name: PREFECT_SERVER_ANALYTICS_ENABLED
            value: "{{ parameters.enable_analytics }}"
    # Expose the Prefect UI through the per-environment ingress
    ingress:
      enabled: true
      host:
        hostname: "{{ services['task-manager'].human_readable_fqdn }}"
        path: /
    server:
      # The Prefect UI is a SPA whose browser-side code calls the API at
      # PREFECT_UI_API_URL (default http://localhost:4200/api). Point it at the
      # ingress URL computed above so the UI works from outside the cluster,
      # mirroring compute_external_url: scheme defaults to https, port omitted
      # when it matches the scheme default (80/http, 443/https).
      {%- set tm_scheme = instance.config.external_url_scheme or "https" %}
      {%- set tm_port = instance.config.external_url_port %}
      {%- set tm_default_port = 80 if tm_scheme == "http" else 443 %}
      uiConfig:
        prefectUiApiUrl: "{{ tm_scheme }}://{{ services['task-manager'].human_readable_fqdn }}{% if tm_port and tm_port != tm_default_port %}:{{ tm_port }}{% endif %}/api"
    postgresql:
      # Propagate the styrmin identifier label to every resource the bitnami
      # postgresql subchart renders (StatefulSet metadata.labels included), so
      # the styrmin/component Kustomize patch can target the StatefulSet by
      # `infrahub/service=task-manager-db`. Without this, the chart only puts
      # the label on the pod template via podLabels.
      commonLabels:
        infrahub/service: task-manager-db
      architecture: standalone
      auth:
        database: prefect
        password: prefect-opsmill
        username: prefect
      enabled: true
      fullnameOverride: styrmin-postgresql
      image:
        tag: 14.13.0
      primary:
        persistence:
          enabled: true
          storageClass: "{{ instance.config.fast_storage.storage_class }}"
        extraVolumes:
          - name: backup
            emptyDir: {}
        extraVolumeMounts:
          - name: backup
            mountPath: /backup
        startupProbe:
          enabled: true
          initialDelaySeconds: 1
          periodSeconds: 1
          timeoutSeconds: 1
          failureThreshold: 120
        readinessProbe:
          initialDelaySeconds: 1
          periodSeconds: 1
          timeoutSeconds: 1
          failureThreshold: 120
        resourcesPreset: none
  rabbitmq:
    enabled: true
    fullnameOverride: styrmin-message-queue
    # See postgresql.commonLabels above — same reason: lift the identifier
    # label onto StatefulSet metadata so styrmin/component can attach.
    commonLabels:
      infrahub/service: message-queue
    auth:
      erlangCookie: styrmin-infrahub-supersecret
    startupProbe:
      enabled: true
      initialDelaySeconds: 1
      periodSeconds: 1
      timeoutSeconds: 1
      failureThreshold: 120
    readinessProbe:
      initialDelaySeconds: 1
      periodSeconds: 1
      timeoutSeconds: 1
      failureThreshold: 120
    resourcesPreset: none
  redis:
    enabled: true
    fullnameOverride: styrmin-cache
    # See postgresql.commonLabels above — same reason: lift the identifier
    # label onto StatefulSet metadata so styrmin/component can attach.
    commonLabels:
      infrahub/service: cache
    master:
      startupProbe:
        enabled: true
        initialDelaySeconds: 1
        periodSeconds: 1
        timeoutSeconds: 1
        failureThreshold: 120
      readinessProbe:
        initialDelaySeconds: 1
        periodSeconds: 1
        timeoutSeconds: 1
        failureThreshold: 120
      resourcesPreset: none
