---
fullnameOverride: styrmin-infrahub-mcp
mcp:
  # Fixed by the driver: the MCP server forwards each caller's bearer token to
  # Infrahub (token-passthrough). The driver stores no Infrahub credential, so
  # the chart's `infrahub.apiToken` block is intentionally left unset.
  authMode: token-passthrough
  readOnly: {{ parameters.mcp_read_only }}
  logLevel: "{{ parameters.mcp_log_level }}"
infrahub:
  address: "{{ parameters.infrahub_address }}"
