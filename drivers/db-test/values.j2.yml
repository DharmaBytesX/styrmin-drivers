fullnameOverride: styrmin-db-test

image:
  repository: db-test
  tag: "{{ app.version }}"

mariadb:
  fullnameOverride: styrmin-db-test-mariadb
  auth:
    database: testdb
    username: testuser
    password: test-password
    rootPassword: root-password
  primary:
    livenessProbe:
      initialDelaySeconds: 1
      periodSeconds: 1
      timeoutSeconds: 1
      failureThreshold: 60
    readinessProbe:
      initialDelaySeconds: 1
      periodSeconds: 1
      timeoutSeconds: 1
      failureThreshold: 60
    persistence:
      size: 1Gi
      storageClass: "{{ instance.config.standard_storage.storage_class }}"
    extraVolumes:
      - name: backup
        emptyDir: {}
    extraVolumeMounts:
      - name: backup
        mountPath: /backup
    # Hard-coded credentials.
    extraEnvVars:
      - name: MARIADB_PASSWORD
        value: test-password

mongodb:
  fullnameOverride: styrmin-db-test-mongodb
  architecture: standalone
  livenessProbe:
    initialDelaySeconds: 1
    periodSeconds: 1
    timeoutSeconds: 1
    failureThreshold: 60
  readinessProbe:
    initialDelaySeconds: 1
    periodSeconds: 1
    timeoutSeconds: 1
    failureThreshold: 60
  auth:
    enabled: true
    rootUser: testuser
    rootPassword: test-mongo-password
  persistence:
    size: 1Gi
    storageClass: "{{ instance.config.standard_storage.storage_class }}"
  extraVolumes:
    - name: backup
      emptyDir: {}
  extraVolumeMounts:
    - name: backup
      mountPath: /backup
  # Hard-coded mongo root credentials.
  extraEnvVars:
    - name: MONGO_INITDB_ROOT_USERNAME
      value: testuser
    - name: MONGO_INITDB_ROOT_PASSWORD
      value: test-mongo-password
