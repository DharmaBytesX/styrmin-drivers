[project]
name = "db-test"
version = "0.1.0"
description = "Test application with MariaDB and MongoDB counters for Styrmin backup testing"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn>=0.32.0",
    "aiomysql>=0.2.0",
    "pymongo>=4.7.0",
    "pydantic-settings>=2.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["db_test"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "DOC",
    "CPY",
    "T201",
    "ISC",
    "COM812",
    "INP001",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
