---
# Styrmin driver for Grafana (https://github.com/grafana/grafana), the observability dashboard.
# Uses the official community chart grafana-community/grafana (appVersion 13.3.0).
apiVersion: "styrmin.io/v1"
kind: ApplicationDriver
metadata:
  name: grafana
spec:
  version: "1"
  # The pinned chart 14.2.0 ships appVersion 13.3.0; the image tags of the 13.3 line
  # follow "<version>-distroless".
  supported_versions: ">=13.3,<13.4"
  default_version: "13.3.0"
  info:
    icon: https://raw.githubusercontent.com/grafana/grafana/main/public/img/logo_transparent_400x.png
    description: Grafana is the leading tool for querying and visualizing time series and metrics.
    authors: [opsmill]
    license: AGPL-3.0
    links:
      - link: Homepage
        url: https://grafana.com
      - link: Documentation
        url: https://grafana.com/docs/grafana/latest/
      - link: Source
        url: https://github.com/grafana/grafana
      - link: Helm chart
        url: https://github.com/grafana-community/helm-charts

  helm:
    main:
      location: https://grafana-community.github.io/helm-charts/grafana
      version: "14.2.0"

  components:
    server:   # Deployment/styrmin-grafana, image docker.io/grafana/grafana:13.3.0-distroless
      container: grafana           # the app container's name in the rendered chart
      singleton: true              # one pod: the SQLite database lives on the data volume
      identifier:
        label:                     # on the Deployment's own labels AND its pod labels
          app.kubernetes.io/name: "grafana"
      backup:
        enabled: true
        kind: disk                 # snapshot of the data volume (dashboards, users, SQLite db)
        volume: storage

  parameters:
    - name: admin_password
      label: Grafana administrator password
      kind: string
      default: "grafana-admin"
    - name: storage_size
      label: Size of the Grafana data volume
      kind: string
      default: "10Gi"

  services:
    - name: grafana
      kind: http
      scope: external              # Styrmin gives it a URL; the chart's Ingress must use it
      port: 3000                   # the port the container listens on
      component: server
