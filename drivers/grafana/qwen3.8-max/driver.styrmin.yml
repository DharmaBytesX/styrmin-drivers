---
# Styrmin driver for Grafana, from the official chart grafana/helm-charts 10.5.15 (appVersion 12.3.1).
apiVersion: "styrmin.io/v1"
kind: ApplicationDriver
metadata:
  name: grafana
spec:
  version: "1"
  supported_versions: ">=12.3,<12.4"
  default_version: "12.3.1"
  info:
    icon: https://artifacthub.io/image/b4fed1a7-6c8f-4945-b99d-096efa3e4116
    description: Grafana is the open-source platform for querying, visualizing and alerting on metrics and logs.
    authors: [opsmill]
    license: AGPL-3.0
    links:
      - link: Homepage
        url: https://grafana.com
      - link: Documentation
        url: https://grafana.com/docs/grafana/latest/
      - link: Source
        url: https://github.com/grafana/grafana
  helm:
    main:
      location: https://grafana.github.io/helm-charts/grafana
      version: "10.5.15"

  components:
    # Grafana keeps its SQLite database, dashboards and installed plugins on the `storage`
    # volume, so it is a single-writer data store: run exactly one pod and snapshot the disk.
    server:
      container: grafana
      singleton: true
      identifier:
        label:
          app.kubernetes.io/name: "grafana"
      backup:
        enabled: true
        kind: disk
        volumes: [storage]

  parameters:
    - name: admin_user
      label: Administrator username
      kind: string
      default: "admin"
    - name: admin_password
      label: Administrator password
      kind: string
      default: "admin-password"
    - name: storage_size
      label: Data volume size (GiB)
      kind: integer
      default: 10

  services:
    - name: grafana
      kind: http
      scope: external
      port: 3000
      component: server
