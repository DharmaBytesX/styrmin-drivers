replicaCount: 1

image:
  registry: ""
  repository: simple-app
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Server container command/args; the deployment template skips an empty list, so the
# image ENTRYPOINT/CMD apply. A user's command/args override sets the container's list
# after the chart renders.
command: []
args: []

# DO NOT REMOVE — rendered as the `STYRMIN_CHART_DEFAULT` chart-default env
# entry that test_deployment_env_vars.py pins (it must survive user env vars).
chartDefaultMarker: "marker"

# Extra env entries appended to the simple-app container. Styrmin injects user
# env vars by post-render patch, not through this list; the E2E suite seeds it
# to simulate a deployment rendered before that change.
extraEnv: []

# A pre-upgrade Helm hook Job and an unlabelled hook ConfigMap. Only the `hook-job`
# E2E test driver turns them on, to check that Helm hooks receive Styrmin's
# post-render patches (#435).
preUpgradeHookJob:
  enabled: false

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: simple-app.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 1
  periodSeconds: 1
  timeoutSeconds: 1
  failureThreshold: 60

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 1
  periodSeconds: 1
  timeoutSeconds: 1
  failureThreshold: 60

nodeSelector: {}
tolerations: []
affinity: {}

# -- Database configuration
database:
  name: simple_app
  host: ""
  port: 5432
  username: ""
  password: ""

# -- Secret configuration
secrets:
  existingSecret: ""

# -- Bitnami PostgreSQL subchart
postgresql:
  enabled: true
  image:
    repository: bitnamilegacy/postgresql
  auth:
    username: simple-app
    password: simple-app-password
    database: simple_app
  primary:
    readinessProbe:
      initialDelaySeconds: 1
      periodSeconds: 1
      timeoutSeconds: 1
      failureThreshold: 60
    # -- Resource configuration for PostgreSQL primary
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits: {}
    persistence:
      enabled: true
      size: 1Gi
