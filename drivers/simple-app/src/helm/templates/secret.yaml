{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "simple-app.secretName" . }}
  labels:
    {{- include "simple-app.labels" . | nindent 4 }}
type: Opaque
data:
  db-username: {{ (.Values.database.username | default .Values.postgresql.auth.username) | b64enc | quote }}
  db-password: {{ (.Values.database.password | default .Values.postgresql.auth.password) | b64enc | quote }}
{{- end }}
