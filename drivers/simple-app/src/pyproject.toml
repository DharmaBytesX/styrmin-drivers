[project]
name = "simple-app"
version = "0.1.0"
description = "Simple 3-tier FastAPI example application for Styrmin driver testing"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlmodel>=0.0.22",
    # The asyncio extra installs greenlet, which SQLAlchemy 2.1 no longer installs by default.
    "sqlalchemy[asyncio]>=2.0.14",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.6.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
simple-app-upgrade = "simple_app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simple_app"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "DOC",
    "CPY",
    "T201",
    "ISC",
    "COM812",
    "INP001",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
