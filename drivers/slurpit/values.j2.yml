---
fullnameOverride: styrmin-slurpit

global:
  timezone: "{{ parameters.timezone }}"
  image:
    version: "{{ app.version }}"
    pullPolicy: IfNotPresent

# Each <component>.env is a map: the chart merges it over its own defaults
# and loads it through a ConfigMap (a list would replace the defaults).

# --- MariaDB ---
mariadb:
  enabled: true
  image:
    name: mariadb
    version: "12-noble"
  service:
    type: ClusterIP
  storage:
    enabled: true
    accessModes: ReadWriteOnce
    size: "{{ parameters.mariadb_storage_size }}Gi"
    className: "{{ instance.config.standard_storage.storage_class }}"
  env:
    MARIADB_DATABASE: portal
    MARIADB_USER: slurpit
    MARIADB_PASSWORD: slurpit-styrmin-password
    MARIADB_ROOT_PASSWORD: slurpit-styrmin-root-password
  extraVolumes:
    - name: backup
      emptyDir: {}
  extraVolumeMounts:
    - name: backup
      mountPath: /backup

# --- MongoDB ---
mongodb:
  enabled: true
  image:
    name: mongo
    version: "8"
  service:
    type: ClusterIP
  storage:
    enabled: true
    accessModes: ReadWriteOnce
    size: "{{ parameters.mongodb_storage_size }}Gi"
    className: "{{ instance.config.standard_storage.storage_class }}"
  env:
    MONGO_INITDB_ROOT_USERNAME: slurpit
    MONGO_INITDB_ROOT_PASSWORD: slurpit-styrmin-mongo-password
  extraVolumes:
    - name: backup
      emptyDir: {}
  extraVolumeMounts:
    - name: backup
      mountPath: /backup

# --- Portal ---
portal:
  enabled: true
  image:
    name: slurpit/portal
    version: latest
  service:
    type: ClusterIP
  storage:
    enabled: true
    accessModes: ReadWriteOnce
    size: "{{ parameters.portal_storage_size }}Gi"
    className: "{{ instance.config.standard_storage.storage_class }}"
  env:
    PORTAL_DB_HOSTNAME: styrmin-slurpit-mariadb-service
    PORTAL_DB_PORT: "3306"
    PORTAL_DB_NAME: portal
    PORTAL_DB_USERNAME: slurpit
    PORTAL_DB_PASSWORD: slurpit-styrmin-password
    PORTAL_WAREHOUSE_URL: "http://styrmin-slurpit-warehouse-service"
    PORTAL_WAREHOUSE_TOKEN: styrmin-slurpit-pw-token
    PORTAL_WAREHOUSE_CALLBACK_TOKEN: styrmin-slurpit-pwcb-token
    PORTAL_SAFEKEY: styrmin-slurpit-safekey
    PORTAL_BASE_URL: "http://{{ services.slurpit.primary_fqdn }}"

ingress:
  enabled: true
  hosts:
    - host: "{{ services.slurpit.primary_fqdn }}"
      paths:
        - path: /
          pathType: Prefix

# --- Warehouse ---
warehouse:
  enabled: true
  image:
    name: slurpit/warehouse
  service:
    type: ClusterIP
  storage:
    enabled: true
    accessModes: ReadWriteOnce
    size: "{{ parameters.warehouse_storage_size }}Gi"
    className: "{{ instance.config.standard_storage.storage_class }}"
  env:
    WAREHOUSE_MONGODB_URI: "mongodb://slurpit:slurpit-styrmin-mongo-password@styrmin-slurpit-mongodb-service:27017/slurpit?authSource=admin"
    WAREHOUSE_PORTAL_URL: "http://styrmin-slurpit-portal-service"
    WAREHOUSE_PORTAL_TOKEN: styrmin-slurpit-pwcb-token
    WAREHOUSE_API_TOKEN: styrmin-slurpit-pw-token

# --- Scanner ---
scanner:
  enabled: true
  image:
    name: slurpit/scanner
  env:
    SCANNER_WAREHOUSE_HOSTNAME: styrmin-slurpit-warehouse-service
    SCANNER_WAREHOUSE_PORT: "50051"
    SCANNER_WAREHOUSE_TOKEN: styrmin-slurpit-pw-token
    SCANNER_POOLSIZE: "{{ parameters.scanner_pool_size }}"

# --- Scraper ---
scraper:
  enabled: true
  image:
    name: slurpit/scraper
  env:
    SCRAPER_WAREHOUSE_HOSTNAME: styrmin-slurpit-warehouse-service
    SCRAPER_WAREHOUSE_PORT: "50051"
    SCRAPER_WAREHOUSE_TOKEN: styrmin-slurpit-pw-token
    SCRAPER_POOLSIZE: "{{ parameters.scraper_pool_size }}"
