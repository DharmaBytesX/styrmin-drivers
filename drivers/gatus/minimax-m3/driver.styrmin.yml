---
# Gatus (https://github.com/TwiN/gatus): automated service health dashboard.
#
# The driver renders the bjw-s app-template chart instead of the upstream twin/gatus chart:
# the upstream chart has no extra-objects value and its own NetworkPolicy only carries ingress
# rules, so it cannot lift Styrmin's default-deny egress and its pod could not resolve DNS.
# See README.md.
apiVersion: "styrmin.io/v1"
kind: ApplicationDriver
metadata:
  name: gatus
spec:
  version: "1"                       # the driver's own version, a quoted string
  supported_versions: ">=5.34,<5.35" # application versions, PEP 440, no "v" prefix
  default_version: "5.34.0"          # must be inside supported_versions
  info:
    icon: https://raw.githubusercontent.com/TwiN/gatus/a1c8422c2ff2b9d0a6f184c99e4dc728d3f2cd75/web/static/logo-192x192.png
    description: Automated service health dashboard
    authors: [opsmill]
    license: Apache-2.0
    links:
      - link: Homepage
        url: https://github.com/TwiN/gatus
      - link: Documentation
        url: https://github.com/TwiN/gatus#readme
  helm:
    main:
      # "<repository URL>/<chart name>": an HTTP repo here, `oci://registry/path/chart` for OCI.
      location: oci://ghcr.io/bjw-s-labs/helm/app-template
      version: "5.2.1"

  components:
    server:
      container: gatus                # the app container's name in the rendered chart
      identifier:
        label:                        # on the Deployment's own labels AND its pod labels
          styrmin/component: server
      singleton: true                 # one pod only: SQLite on a ReadWriteOnce volume
      backup:
        enabled: true
        kind: disk                    # snapshots the `data` volume (the SQLite database)
        volume: data

  parameters:
    - name: monitored_url
      label: URL the dashboard watches
      kind: string
      default: "http://styrmin-gatus:8080/"

  services:
    - name: gatus
      kind: http
      scope: external                 # Styrmin gives it a URL; the chart's Ingress must use it
      port: 8080                      # the port the container listens on
      component: server
