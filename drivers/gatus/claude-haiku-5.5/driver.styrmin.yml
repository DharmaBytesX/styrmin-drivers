---
# Gatus on the bjw-s app-template chart. The Gatus chart (twin.github.io/helm-charts/gatus) renders a
# NetworkPolicy with ingress rules only, so its pods could not resolve DNS under Styrmin (Styrmin denies
# all egress in the namespace). app-template renders the Deployment, Service, Ingress, ConfigMap and
# NetworkPolicies from values, so the driver can allow DNS and the monitored endpoints.
apiVersion: "styrmin.io/v1"
kind: ApplicationDriver
metadata:
  name: gatus
spec:
  version: "1"
  supported_versions: ">=5.34,<5.35"
  default_version: "5.34.0"   # the image tag: values.j2.yml uses app.version
  info:
    icon: https://raw.githubusercontent.com/TwiN/gatus/a1c8422c2ff2b9d0a6f184c99e4dc728d3f2cd75/web/static/logo-192x192.png
    description: Automated service health dashboard
    links:
      - link: Homepage
        url: https://github.com/TwiN/gatus
      - link: Source
        url: https://github.com/TwiN/gatus
  helm:
    main:
      location: oci://ghcr.io/bjw-s-labs/helm/app-template
      version: 5.2.1

  components:
    server:
      container: app
      identifier:
        label:
          styrmin/component: server

  services:
    - name: gatus
      kind: http
      scope: external
      port: 8080               # the port the container listens on
      component: server
